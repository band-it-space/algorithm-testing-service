version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  algorithm-service:
    env_file: .env
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_JSON=${LOG_JSON:-false}
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/app/credentials/google_sheets.json
      - INPUT_SHEET_ID=${INPUT_SHEET_ID:-11a3m0AlIGsZ5O1HRVgjCP3zSCds-b_5OJGXmHKCP56U}
      - OUTPUT_SHEET_ID=${OUTPUT_SHEET_ID:-11a3m0AlIGsZ5O1HRVgjCP3zSCds-b_5OJGXmHKCP56U}
      - INPUT_SHEET_NAME=${INPUT_SHEET_NAME:-Parameter Tuning}
      - OUTPUT_SHEET_NAME=${OUTPUT_SHEET_NAME:-Automated Results}
      - OUTPUT_PER_GENOME_SHEET_NAME=${OUTPUT_PER_GENOME_SHEET_NAME:-Automated Results Per Genome}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./workers:/app/workers
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: ${HEALTH_CHECK_INTERVAL:-30}s
      timeout: ${HEALTH_CHECK_TIMEOUT:-10}s
      retries: 3
      start_period: 40s

  algorithm-worker:
    build: .
    command: python workers/start_algorithm_worker.py
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_DIR=/app/logs
      - OPTIMIZATION_START_DATE=${OPTIMIZATION_START_DATE:-2016-01-01}
      - OPTIMIZATION_END_DATE=${OPTIMIZATION_END_DATE:-2026-02-02}
      - SMART_FILTERING_ENABLED=${SMART_FILTERING_ENABLED:-true}
      - MIN_PAYOFF_RATIO=${MIN_PAYOFF_RATIO:-2}
      - OUT_PAYOFF_RATIO=${OUT_PAYOFF_RATIO:-1}
      - MIN_OBSERVATIONS=${MIN_OBSERVATIONS:-2}
    volumes:
      - ./app:/app/app
      - ./workers:/app/workers
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  result-worker:
    build: .
    command: python workers/start_result_worker.py
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RESULT_WORKER_TIMEOUT=${RESULT_WORKER_TIMEOUT:-300}
      - RESULT_WORKER_MAX_RETRIES=${RESULT_WORKER_MAX_RETRIES:-3}
      - RESULT_WORKER_COUNT=${RESULT_WORKER_COUNT:-2}
      - RESULT_CONCURRENT_TASKS=${RESULT_CONCURRENT_TASKS:-5}
      - WORKER_CONCURRENT_TASKS=${WORKER_CONCURRENT_TASKS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_JSON=${LOG_JSON:-false}
      - GOOGLE_SHEETS_CREDENTIALS_PATH=/app/credentials/google_sheets.json
      - INPUT_SHEET_NAME=${INPUT_SHEET_NAME:-Parameter Tuning}
      - OUTPUT_SHEET_NAME=${OUTPUT_SHEET_NAME:-Automated Results}
      - OUTPUT_PER_GENOME_SHEET_NAME=${OUTPUT_PER_GENOME_SHEET_NAME:-Automated Results Per Genome}
      - OPTIMIZATION_START_DATE=${OPTIMIZATION_START_DATE:-2016-01-01}
      - OPTIMIZATION_END_DATE=${OPTIMIZATION_END_DATE:-2026-02-02}
      - SMART_FILTERING_ENABLED=${SMART_FILTERING_ENABLED:-true}
      - MIN_PAYOFF_RATIO=${MIN_PAYOFF_RATIO:-2}
      - OUT_PAYOFF_RATIO=${OUT_PAYOFF_RATIO:-1}
      - MIN_OBSERVATIONS=${MIN_OBSERVATIONS:-2}
    volumes:
      - ./app:/app/app
      - ./workers:/app/workers
      - ./logs:/app/logs
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    depends_on:
      - redis
    restart: unless-stopped

  file-write-worker:
    build: .
    command: python workers/start_file_write_worker.py
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - FILE_WRITE_WORKER_TIMEOUT=${FILE_WRITE_WORKER_TIMEOUT:-60}
      - FILE_WRITE_WORKER_MAX_RETRIES=${FILE_WRITE_WORKER_MAX_RETRIES:-3}
      - FILE_WORKER_COUNT=${FILE_WORKER_COUNT:-1}
      - FILE_CONCURRENT_TASKS=${FILE_CONCURRENT_TASKS:-3}
      - WORKER_CONCURRENT_TASKS=${WORKER_CONCURRENT_TASKS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_JSON=${LOG_JSON:-false}
    volumes:
      - ./app:/app/app
      - ./workers:/app/workers
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  rq-dashboard:
    build: .
    command: python dashboard/start_dashboard.py
    ports:
      - "${DASHBOARD_PORT:-9181}:9181"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-9181}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      - redis
    restart: unless-stopped
